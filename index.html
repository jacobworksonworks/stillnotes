<style>

title{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d9dcde}.note-preview{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.note-date{font-size:10px;color:#69717a;margin-top:5px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:9px;display:grid;gap:3px}.side-link{text-align:left;padding:7px 9px;color:var(--muted);font-size:12px;border-radius:4px}.side-link:hover{color:var(--text);background:var(--panel2)}.workspace{min-width:0;display:grid;grid-template-rows:44px 1fr;position:relative}.toolbar{padding:0 20px;border-bottom:1px solid var(--line);gap:4px}.tool-sep{height:17px;width:1px;background:var(--line);margin:0 7px}.tool-label{font-size:11px;color:var(--muted);margin-left:auto}.editor-wrap{min-height:0;overflow:auto;display:flex;justify-content:center;padding:42px 32px 80px}.paper{width:100%;max-width:760px;min-height:100%;display:flex;flex-direction:column}.title-input{background:transparent;border:0;outline:0;font:500 24px/1.3 var(--editor);color:#e8e8e5;padding:0 0 18px;resize:none;width:100%}.editor{width:100%;min-height:calc(100vh - 210px);resize:none;border:0;outline:0;background:transparent;color:#c9cdd0;font:16px/1.85 var(--editor);letter-spacing:.005em;tab-size:4}.editor::placeholder{color:#50565d}.editor.narrow{max-width:660px}.editor.mono{font-family:var(--mono);font-size:14px;line-height:1.8}.editor.sans{font-family:Inter,system-ui,sans-serif}.editor.dyslexic{font-family:Verdana,Arial,sans-serif;letter-spacing:.025em;line-height:2}.preview{white-space:normal;color:#c9cdd0;font:15px/1.8 var(--editor);overflow-wrap:anywhere}.preview h1,.preview h2,.preview h3{color:#e4e5e7;line-height:1.3}.preview code{font-family:var(--mono);background:#22262b;padding:2px 4px;border-radius:3px}.preview pre{background:#191c20;border:1px solid var(--line);padding:12px;overflow:auto}.preview blockquote{border-left:2px solid #64705f;margin-left:0;padding-left:14px;color:var(--muted)}.status{padding:0 14px;border-top:1px solid var(--line);background:#131416;color:#78808a;font-size:10px;gap:15px}.status .save{margin-left:auto}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#82947c;margin-right:6px}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.open{display:flex}.modal{width:min(560px,100%);max-height:85vh;overflow:auto;background:#181a1e;border:1px solid #343940;border-radius:7px;box-shadow:0 18px 60px #0008}.modal-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:13px;font-weight:600;margin:0}.modal-body{padding:16px 18px}.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:7px}.field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #25292e;font-size:12px;color:var(--soft)}.field:last-child{border:0}.field select,.field input{background:#202328;border:1px solid #353a40;border-radius:4px;padding:6px 8px;min-width:145px;font-size:12px}.muted{color:var(--muted)}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;background:#202328;border:1px solid var(--line);border-radius:5px}.stat strong{display:block;font-size:20px;font-weight:500}.stat small{color:var(--muted);font-size:10px}.toolrow{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.toolrow button{padding:7px 9px;border:1px solid var(--line);border-radius:4px;color:var(--soft);font-size:11px}.toolrow button:hover{background:#252a2f}.modal textarea{width:100%;min-height:100px;background:#121416;border:1px solid var(--line);border-radius:4px;padding:9px;resize:vertical;font:12px/1.6 var(--mono)}.symbol-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:12px}.symbol-grid button{padding:8px 2px;border:1px solid var(--line);border-radius:4px;font-size:16px}.hidden{display:none!important}.focus .layout{grid-template-columns:1fr}.focus .sidebar,.focus .top-actions,.focus .toolbar .hide-focus{display:none}.focus .top{justify-content:center}.focus .workspace{grid-template-rows:1fr}.focus .editor-wrap{padding-top:10vh}.focus .status{justify-content:center}.focus .status>*:not(.save){display:none}.focus .paper{max-width:700px}.toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);padding:7px 12px;background:#272c30;border:1px solid #41474d;border-radius:4px;color:#d8dcdf;font-size:11px;opacity:0;pointer-events:none;transition:opacity .15s}.toast.show{opacity:1}.taskline{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.taskline input{accent-color:#aab99f}.taskline.done span{text-decoration:line-through;color:var(--muted)}@media(max-width:720px){.layout{grid-template-columns:1fr}.sidebar{display:none}.editor-wrap{padding:28px 20px 60px}.toolbar{padding:0 10px}.tool-label{display:none}.status{gap:8px}.brand span{display:none}}@media(min-width:721px){.focus .sidebar{display:none}}

.suite-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.suite-item{text-align:left;padding:12px;border:1px solid var(--line);border-radius:5px;background:#1c1f23}.suite-item:hover{background:#252a2f}.suite-item b,.suite-item small{display:block}.suite-item b{font-size:12px;font-weight:550}.suite-item small{font-size:10px;color:var(--muted);margin-top:3px}.pomo-face{text-align:center;padding:20px}.pomo-face strong{display:block;font:300 54px/1.3 var(--mono);letter-spacing:-.06em}.pomo-face small{color:var(--muted);font-size:10px;letter-spacing:.12em}.center{justify-content:center}.diffout{white-space:pre-wrap;background:#121416;padding:10px;border:1px solid var(--line);font:11px/1.6 var(--mono);max-height:220px;overflow:auto}.teleview{height:260px;overflow:auto;background:#101214;border:1px solid var(--line);padding:20px;font:24px/1.7 Georgia,serif;white-space:pre-wrap}.breath-wrap{text-align:center;padding:16px;display:grid;justify-items:center;gap:12px}.breath-orb{width:100px;height:100px;border-radius:50%;background:#71806a;opacity:.65;transition:transform 1s ease}.drawcanvas{width:100%;height:auto;border:1px solid var(--line);touch-action:none}.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.kanban section{background:#141619;padding:8px;border:1px solid var(--line);border-radius:4px;min-width:0}.kanban section>b{font-size:11px}.kanban input{width:100%;min-width:0;background:#202328;border:1px solid var(--line);padding:6px;margin-top:8px}.kcard{background:#22262a;padding:7px;margin:7px 0;font-size:11px;overflow-wrap:anywhere}.kcard .toolrow{margin:4px 0 0}.kcard button{font-size:9px;padding:3px}.richedit{min-height:250px;background:#111315;border:1px solid var(--line);padding:12px;line-height:1.7;outline:none}.richedit img{max-width:100%}.mdsplit{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mdsplit textarea{height:340px}.mdsplit .preview{height:340px;overflow:auto;background:#121416;border:1px solid var(--l /* Layout repairs */
html,body{min-height:100%;overflow:hidden}
.app{height:100dvh;min-height:0;grid-template-rows:52px minmax(0,1fr) auto;overflow:hidden}
.layout{min-height:0;min-width:0;overflow:hidden}
.workspace{min-height:0;min-width:0;overflow:hidden}
.toolbar{min-width:0;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;scrollbar-color:#343940 transparent}
.toolbar>*{flex:0 0 auto}
.tool-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:22%;flex:1 1 auto;text-align:right}
.editor-wrap{min-height:0;min-width:0;overscroll-behavior:contain}

.status{min-width:0;min-height:30px;height:auto;max-height:none;flex-wrap:wrap;padding:6px 14px;row-gap:3px;column-gap:14px;line-height:1.3}
.status .save{margin-left:auto;white-space:nowrap}
.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 44px);z-index:20}
.overlay{z-index:30;overflow:auto}
.modal{min-width:0;max-height:min(85dvh,760px);overscroll-behavior:contain}
.modal-body{min-width:0;overflow-wrap:anywhere}
.modal-foot{position:sticky;bottom:0;background:#181a1e}
.suite-grid,.kanban,.mdsplit{min-width:0}
.suite-item{min-width:0;overflow-wrap:anywhere}
.mdSplit textarea,.mdsplit textarea{min-width:0;max-width:100%}
@media(max-width:720px){
 .app{grid-template-rows:48px minmax(0,1fr) auto}
 .top{padding:0 10px;min-width:0}
 .top-actions{gap:2px}
 .iconbtn{min-width:28px;padding:0 6px}
 .layout{grid-template-columns:minmax(0,1fr)}

 .toolbar{padding:0 8px;gap:3px}

 .status .save{width:100%;margin-left:0}

}

</style></head>
<body><div class="app" id="app"><header class="top"><div class="brand">STILL <span>/ a quiet place to write.. amirite?</span></div><div class="top-actions"><button class="iconbtn" id="timerBtn" title="Writing timer">◷</button><button class="iconbtn" id="statsBtn" title="Statistics">▤</button><button class="iconbtn" id="toolsBtn" title="Tools">⌘</button><button class="iconbtn" id="prefsBtn" title="Preferences">⚙</button><button class="iconbtn" id="focusBtn" title="Focus mode">⤢</button></div></header>
<div class="layout"><aside class="sidebar"><div class="side-head"><span>Notes</span><button class="btn" id="newNote">＋ New</button></div><div class="note-list" id="noteList"></div><div class="side-bottom"><button class="side-link" id="tasksBtn">☷ &nbsp; Tasks</button><button class="side-link" id="snapBtn">↶ &nbsp; Snapshots</button><button class="side-link" id="importBtn">＋ &nbsp; Import text file</button><input type="file" id="fileInput" accept=".txt,.md,.html,text/plain,text/markdown" hidden></div></aside>
<main class="workspace"><div class="toolbar"><button class="btn" id="downloadBtn" title="Download plain text">Save</button><button class="btn" id="copyBtn">Copy</button><button class="btn" id="htmlBtn">HTML</button><button class="btn" id="pdfBtn">PDF</button><button class="btn" id="shareBtn">Share</button><button class="btn" id="floatBtn">Float</button><button class="btn" id="markdownBtn">Preview</button><span class="tool-sep"></span><button class="btn" id="symbolsBtn">Symbols</button><button class="btn hide-focus" id="soundBtn" title="Ambient sound">Sound</button><span class="tool-label" id="docLabel">Untitled</span></div><section class="editor-wrap"><div class="paper"><textarea class="title-input" id="noteTitle" rows="1" placeholder="Untitled" spellcheck="false"></textarea><textarea class="editor" id="editor" placeholder="Start writing…" spellcheck="true"></textarea><article class="preview hidden" id="preview"></article></div></section></main></div>
<footer class="status"><span id="wordCount">0 words</span><span id="charCount">0 characters</span><span id="lineCount">Ln 1, Col 1</span><span id="timerStatus">00:00</span><span class="save"><i class="dot"></i><span id="saveStatus">Saved locally</span></span></footer></div>
<div class="overlay" id="modalOverlay"><section class="modal"><div class="modal-head"><h2 id="modalTitle">Preferences</h2><button class="iconbtn" id="modalClose">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"><button class="btn" id="modalDone">Close</button></div></section></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='still-notes-v1';let data=load(),active=data.active||data.notes[0]?.id,dirty=false,previewing=false,timer=null,seconds=0,timerRunning=false,ambient=null,breakAt=0,recognition=null;
function uid(){return Math.random().toString(36).slice(2,10)}function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&d.notes?.length)return d}catch(e){}let n={id:uid(),title:'Untitled',body:'',updated:Date.now(),snapshots:[]};return{notes:[n],active:n.id,tasks:[],prefs:{font:'serif',size:16,narrow:true,spell:true,tab:true,breaks:false,breakMins:45,typewriter:false}}}function current(){return data.notes.find(n=>n.id===active)||data.notes[0]}function persist(){localStorage.setItem(KEY,JSON.stringify(data));dirty=false;$('saveStatus').textContent='Saved locally'}function schedule(){dirty=true;$('saveStatus').textContent='Saving…';clearTimeout(schedule.t);schedule.t=setTimeout(()=>{let n=current();n.title=$('noteTitle').value;n.body=$('editor').value;n.updated=Date.now();persist();renderList()},350)}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1700)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderList(){let q=$('noteList');q.innerHTML='';data.notes.slice().sort((a,b)=>b.updated-a.updated).forEach(n=>{let el=document.createElement('div');el.className='note-item'+(n.id===active?' active':'');el.innerHTML=`<div class="note-title">${escapeHTML(n.title||'Untitled')}</div><div class="note-preview">${escapeHTML((n.body||'No text yet').replace(/\s+/g,' ').slice(0,62))}</div><div class="note-date">${new Date(n.updated).toLocaleDateString()}</div>`;el.onclick=()=>switchNote(n.id);el.oncontextmenu=e=>{e.preventDefault();if(confirm('Delete this note?'))deleteNote(n.id)};q.append(el)})}
function switchNote(id){if(dirty){let n=current();n.title=$('noteTitle').value;n.body=$('editor').value;n.updated=Date.now();persist()}active=id;data.active=id;let n=current();$('noteTitle').value=n.title;$('editor').value=n.body;previewing=false;$('editor').classList.remove('hidden');$('preview').classList.add('hidden');$('markdownBtn').textContent='Preview';updateCounts();renderList();persist()}
function newNote(){let n={id:uid(),title:'Untitled',body:'',updated:Date.now(),snapshots:[]};data.notes.push(n);switchNote(n.id);$('noteTitle').focus()}
function deleteNote(id){if(data.notes.length===1){data.notes[0].title='Untitled';data.notes[0].body='';data.notes[0].snapshots=[];switchNote(data.notes[0].id)}else{data.notes=data.notes.filter(n=>n.id!==id);if(active===id)active=data.notes[0].id;switchNote(active)}toast('Note deleted')}
function updateCounts(){let t=$('editor').value,words=t.trim()?t.trim().split(/\s+/u).length:0,lines=t.split('\n');$('wordCount').textContent=words+' words';$('charCount').textContent=t.length+' characters';let p=$('editor').selectionStart,before=t.slice(0,p).split('\n');$('lineCount').textContent=`Ln ${before.length}, Col ${before.at(-1).length+1}`}
function exportFile(ext){let n=current(),body=$('editor').value,title=$('noteTitle').value||'Untitled',blob,name;if(ext==='html'){blob=new Blob([`<!doctype html><meta charset="utf-8"><title>${escapeHTML(title)}</title><article style="max-width:720px;margin:3rem auto;font:16px/1.7 Georgia">${body.split('\n').map(x=>'<p>'+escapeHTML(x||' ')+'</p>').join('')}</article>`],{type:'text/html'});name=title+'.html'}else{blob=new Blob([body],{type:'text/plain;charset=utf-8'});name=title+'.txt'}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);toast('Downloaded '+name)}
function showModal(title,html,foot){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalFoot').innerHTML=foot||'<button class="btn" id="modalDone">Close</button>';$('modalOverlay').classList.add('open');let d=$('modalFoot').querySelector('#modalDone');if(d)d.onclick=closeModal}function closeModal(){$('modalOverlay').classList.remove('open')}
function stats(){let t=$('editor').value,w=t.trim()?t.trim().split(/\s+/).length:0,sent=(t.match(/[.!?]+(?=\s|$)/g)||[]).length,chars=t.length,letters=(t.match(/[A-Za-z]/g)||[]).length,unique=new Set((t.toLowerCase().match(/[a-z]+/g)||[])).size,mins=Math.ceil(w/200);showModal('Note statistics',`<div class="stat-grid"><div class="stat"><strong>${w}</strong><small>Words</small></div><div class="stat"><strong>${chars}</strong><small>Characters</small></div><div class="stat"><strong>${t.split('\n').length}</strong><small>Lines</small></div><div class="stat"><strong>${sent}</strong><small>Sentences</small></div><div class="stat"><strong>${unique}</strong><small>Unique words</small></div><div class="stat"><strong>${mins} min</strong><small>Speaking time</small></div></div><p class="muted" style="font-size:11px;margin-top:14px">Estimated reading time: ${Math.max(1,Math.ceil(w/230))} min · Lexical density: ${w?Math.round(unique/Math.max(1,w)*100)+'%':'—'} · Estimated pages: ${(w/250).toFixed(1)}</p>`)}
function preferences(){let p=data.prefs;showModal('Preferences',`<div class="field"><span>Font</span><select id="prefFont"><option value="serif">Serif</option><option value="sans">Sans serif</option><option value="mono">Monospaced</option><option value="dyslexic">Readable</option></select></div><div class="field"><span>Font size</span><input id="prefSize" type="number" min="12" max="28" value="${p.size}"></div><div class="field"><span>Reading width</span><select id="prefWidth"><option value="true">Narrow</option><option value="false">Full</option></select></div><div class="field"><span>Spellcheck</span><input id="prefSpell" type="checkbox" ${p.spell?'checked':''}></div><div class="field"><span>Tab indentation</span><input id="prefTab" type="checkbox" ${p.tab?'checked':''}></div><div class="field"><span>Break reminder</span><input id="prefBreak" type="checkbox" ${p.breaks?'checked':''}></div><div class="field"><span>Reminder interval (minutes)</span><input id="prefBreakMins" type="number" min="15" max="120" value="${p.breakMins}"></div><div class="field"><span>Typewriter key sound</span><input id="prefType" type="checkbox" ${p.typewriter?'checked':''}></div><p class="muted" style="font-size:10px">Notes are stored in this browser. Export a backup if you need to move them.</p>`,`<button class="btn" id="modalDone">Cancel</button><button class="btn primary" id="savePrefs">Apply</button>`);$('prefFont').value=p.font;$('prefWidth').value=String(p.narrow);$('savePrefs').onclick=()=>{p.font=$('prefFont').value;p.size=Math.max(12,Math.min(28,+$('prefSize').value||16));p.narrow=$('prefWidth').value==='true';p.spell=$('prefSpell').checked;p.tab=$('prefTab').checked;p.breaks=$('prefBreak').checked;p.breakMins=Math.max(15,+$('prefBreakMins').value||45);p.typewriter=$('prefType').checked;applyPrefs();persist();closeModal()}}

let recorder=null,recordChunks=[];function voiceTool(){toolShell('Voice Notes',`<div class="toolrow"><button id="voiceStart" class="btn primary">Record</button><button id="voiceStop" class="btn">Stop</button></div><p class="muted" id="voiceStatus">Recordings are kept in this page until downloaded.</p><div id="voiceList"></div>`);$('voiceStart').onclick=async()=>{try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>recordChunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='voice-note-'+Date.now()+'.webm';a.textContent='Download recording';$('voiceList').append(a);stream.getTracks().forEach(t=>t.stop())};recorder.start();$('voiceStatus').textContent='Recording…'}catch(e){$('voiceStatus').textContent='Microphone permission or recording is unavailable in this browser.'}};$('voiceStop').onclick=()=>{if(recorder?.state==='recording'){recorder.stop();$('voiceStatus').textContent='Recording ready'}}}
function kanbanTool(){let board=suiteStore('kanban')||{todo:[],doing:[],done:[]};toolShell('Kanban',`<div class="kanban"><section><b>To do</b><div id="kTodo"></div><input id="kNew" placeholder="Add card"><button id="kAdd">＋ Add</button></section><section><b>In progress</b><div id="kDoing"></div></section><section><b>Done</b><div id="kDone"></div></section></div><button id="kExport" class="btn">Export CSV</button>`);const render=()=>{[['todo','kTodo'],['doing','kDoing'],['done','kDone']].forEach(([col,id])=>{$(id).innerHTML=board[col].map((x,i)=>`<div class="kcard">${escapeHTML(x)}<div class="toolrow"><button data-move="${col},${i},${col==='todo'?'doing':col==='doing'?'done':'todo'}">${col==='done'?'Reopen':'Next →'}</button><button data-remove="${col},${i}">×</button></div></div>`).join('')});suiteStore('kanban',board);$('modalBody').querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let [a,i,c]=b.dataset.move.split(',');board[c].push(board[a].splice(+i,1)[0]);render()});$('modalBody').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let [a,i]=b.dataset.remove.split(',');board[a].splice(+i,1);render()})};$('kAdd').onclick=()=>{let v=$('kNew').value.trim();if(v){board.todo.push(v);$('kNew').value='';render()}};$('kExport').onclick=()=>downloadText('kanban.csv',['Column,Task',...Object.entries(board).flatMap(([k,v])=>v.map(x=>k+','+JSON.stringify(x)))].join('\n'),'text/csv');render()}
function richTool(){toolShell('Rich Text',`<div class="toolrow"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="insertUnorderedList">• List</button><button data-cmd="formatBlock" data-val="h2">Heading</button><button id="richLink">Link</button><button id="richImage">Image</button><button id="richExport">Export HTML</button></div><div id="richEditor" contenteditable="true" class="richedit">${escapeHTML($('editor').value).replace(/\n/g,'<br>')}</div><input id="richFile" type="file" accept="image/*" hidden>`);$('modalBody').querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{ $('richEditor').focus();document.execCommand(b.dataset.cmd,false,b.dataset.val||null)});$('richLink').onclick=()=>{let u=prompt('Link URL');if(u)document.execCommand('createLink',false,u)};$('richImage').onclick=()=>$('richFile').click();$('richFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{ $('richEditor').focus();document.execCommand('insertImage',false,r.result)};r.readAsDataURL(f)};$('richExport').onclick=()=>downloadText('rich-note.html','<!doctype html><meta charset="utf-8">'+$('richEditor').innerHTML,'text/html')}
function markdownTool(){toolShell('Markdown Editor',`<div class="mdsplit"><textarea id="mdInput">${escapeHTML($('editor').value)}</textarea><article id="mdPreview" class="preview"></article></div>`);const update=()=>$('mdPreview').innerHTML=markdownToHTML($('mdInput').value);$('mdInput').oninput=update;update()}
function tabbyTool(){let tabs=suiteStore('tabby')||[{title:'Note 1',body:''}],idx=0;toolShell('Tabbypad',`<div class="toolrow" id="tabTabs"></div><button id="tabNew" class="btn">＋ New note</button><input id="tabTitle" placeholder="Title" style="width:100%;margin:10px 0"><textarea id="tabBody" style="min-height:250px"></textarea><div class="toolrow"><button id="tabExport" class="btn">Export all</button><button id="tabDelete" class="btn">Delete current</button></div>`);const save=()=>{tabs[idx].title=$('tabTitle').value;tabs[idx].body=$('tabBody').value;suiteStore('tabby',tabs)};const render=()=>{$('tabTabs').innerHTML=tabs.map((t,i)=>`<button data-tab="${i}" class="btn ${i===idx?'primary':''}">${escapeHTML(t.title||'Untitled')}</button>`).join('');$('tabTitle').value=tabs[idx].title;$('tabBody').value=tabs[idx].body;$('tabTabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{save();idx=+b.dataset.tab;render()})};$('tabTitle').oninput=save;$('tabBody').oninput=save;$('tabNew').onclick=()=>{save();tabs.push({title:'Note '+(tabs.length+1),body:''});idx=tabs.length-1;render()};$('tabDelete').onclick=()=>{if(tabs.length===1){tabs[0]={title:'Note 1',body:''};idx=0}else{tabs.splice(idx,1);idx=0}render();save()};$('tabExport').onclick=()=>downloadText('tabbypad.txt',tabs.map(t=>'# '+t.title+'\n'+t.body).join('\n\n---\n\n'),'text/plain');render()}
function ambientTool(){toolShell('Ambient Sound',`<p class="muted">Generated locally with the Web Audio API. Sounds can be mixed.</p><div id="ambRows">${['Rain','Brown noise','White noise','Pink noise','Wind','Fan','Ocean','Fire'].map((x,i)=>`<div class="field"><label><input type="checkbox" data-amb="${i}"> ${x}</label><input type="range" min="0" max="100" value="25" data-vol="${i}"></div>`).join('')}</div><div class="toolrow"><button id="ambStop" class="btn">Stop all</button></div>`);let ctx=null,nodes=[];const stop=()=>{nodes.forEach(n=>{try{n.stop?.();n.disconnect?.()}catch(e){}});nodes=[]};$('ambStop').onclick=()=>{stop();$('ambRows').querySelectorAll('[data-amb]').forEach(x=>x.checked=false)};$('ambRows').querySelectorAll('[data-amb]').forEach(c=>c.onchange=()=>{if(!c.checked)return;try{ctx=ctx||new AudioContext();let i=+c.dataset.amb,buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=buf.getChannelData(0);for(let j=0;j<d.length;j++){let v=Math.random()*2-1;d[j]=i===1?v*.45:i===2?v*.15:i===3?(v*.5+(d[j-1]||0)*.5):v*.18}let src=ctx.createBufferSource();src.buffer=buf;src.loop=true;let filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=[1800,300,8000,1200,500,350,700,400][i];let gain=ctx.createGain();gain.gain.value=+$('ambRows').querySelector(`[data-vol="${i}"]`).value/400;src.connect(filter).connect(gain).connect(ctx.destination);src.start();nodes.push(src,filter,gain)}catch(e){toast('Audio unavailable')}})}
function downloadText(name,text,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

function exportHTML(){let n=current(),title=$('noteTitle').value||'Untitled',body=$('editor').value;downloadText((title.replace(/[\\/:*?"<>|]/g,'_')||'note')+'.html','<!doctype html><html><head><meta charset="utf-8"><title>'+escapeHTML(title)+'</title><style>body{max-width:760px;margin:4rem auto;padding:0 1rem;font:17px/1.8 Georgia,serif;color:#222}pre{white-space:pre-wrap}</style></head><body><h1>'+escapeHTML(title)+'</h1><pre>'+escapeHTML(body)+'</pre></body></html>','text/html')}
function exportPDF(){let title=$('noteTitle').value||'Untitled',body=$('editor').value,w=window.open('','_blank');if(!w){toast('Allow pop-ups to print');return}w.document.write('<!doctype html><meta charset="utf-8"><title>'+escapeHTML(title)+'</title><style>body{max-width:760px;margin:40px auto;font:16px/1.7 Georgia,serif;white-space:pre-wrap;color:#111}@media print{body{margin:0}}</style><h1>'+escapeHTML(title)+'</h1><main>'+escapeHTML(body)+'</main>');w.document.close();w.focus();setTimeout(()=>w.print(),250)}
async function shareNote(){let text=$('noteTitle').value+'\n\n'+$('editor').value;try{if(navigator.share)await navigator.share({title:$('noteTitle').value||'Note',text});else{await navigator.clipboard.writeText(text);toast('Copied for sharing')}}catch(e){}}
async function floatNote(){if(!('documentPictureInPicture'in window)){toast('Floating window is not supported in this browser');return}try{let w=await documentPictureInPicture.requestWindow({width:420,height:520});w.document.body.style.cssText='margin:0;background:#111214;color:#e4e5e7;font:14px system-ui;padding:14px';let t=w.document.createElement('textarea');t.value=$('editor').value;t.style.cssText='width:100%;height:90%;box-sizing:border-box;background:#17191c;color:#e4e5e7;border:1px solid #292d32;padding:12px;font:15px/1.7 Georgia;resize:none';w.document.body.append(t);t.addEventListener('input',()=>{$('editor').value=t.value;schedule();updateCounts()});$('editor').addEventListener('input',()=>{if(w.closed)return;if(t.value!==$('editor').value)t.value=$('editor').value});w.addEventListener('pagehide',()=>{})}catch(e){toast('Could not open floating window')}}
$('editor').addEventListener('input',()=>{schedule();updateCounts();if(previewing)$('preview').innerHTML=markdownToHTML($('editor').value);if(data.prefs.typewriter)typeSound();if(data.prefs.breaks&&seconds>0&&seconds%60===0&&seconds>=data.prefs.breakMins*60&&seconds!==breakAt){breakAt=seconds;toast('Time for a short break')}});$('noteTitle').addEventListener('input',()=>{schedule();$('docLabel').textContent=$('noteTitle').value||'Untitled'});$('editor').addEventListener('click',updateCounts);$('editor').addEventListener('keyup',updateCounts);$('editor').addEventListener('keydown',e=>{if(e.key==='Tab'&&data.prefs.tab){e.preventDefault();insertAtCursor('    ')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportFile('txt')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showModal('Keyboard shortcuts',`<div class="field"><span>Ctrl/⌘ + S</span><span>Save as text</span></div><div class="field"><span>Ctrl/⌘ + ,</span><span>Preferences</span></div><div class="field"><span>Alt + F</span><span>Focus mode</span></div><div class="field"><span>Ctrl/⌘ + Shift + O</span><span>Insert symbol</span></div><div class="field"><span>Ctrl/⌘ + Shift + Delete</span><span>Clear note</span></div><div class="field"><span>Tab</span><span>Indent</span></div>`)}});
function typeSound(){try{let c=typeSound.ctx||(typeSound.ctx=new(window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=800+Math.random()*300;g.gain.value=.012;o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.018)}catch(e){}}
$('newNote').onclick=newNote;$('downloadBtn').onclick=()=>exportFile('txt');$('htmlBtn').onclick=exportHTML;$('pdfBtn').onclick=exportPDF;$('shareBtn').onclick=shareNote;$('floatBtn').onclick=floatNote;$('copyBtn').onclick=()=>{navigator.clipboard?.writeText($('editor').value).then(()=>toast('Copied')).catch(()=>toast('Clipboard unavailable'))};$('markdownBtn').onclick=togglePreview;$('symbolsBtn').onclick=symbolPicker;$('statsBtn').onclick=stats;$('prefsBtn').onclick=preferences;$('toolsBtn').onclick=toolHub;$('focusBtn').onclick=toggleFocus;$('timerBtn').onclick=timerModal;$('snapBtn').onclick=snapshots;$('tasksBtn').onclick=tasks;$('soundBtn').onclick=ambientToggle;$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{newNote();$('noteTitle').value=f.name.replace(/\.[^.]+$/,'');$('editor').value=r.result;schedule();updateCounts()};r.readAsText(f);e.target.value=''};$('modalClose').onclick=closeModal;$('modalOverlay').onclick=e=>{if(e.target===$('modalOverlay'))closeModal()};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key===','){e.preventDefault();preferences()}if(e.altKey&&e.key.toLowerCase()==='f'){e.preventDefault();toggleFocus()}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='o'){e.preventDefault();symbolPicker()}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==='Delete'){e.preventDefault();if(confirm('Clear this note?')){$('editor').value='';schedule();updateCounts()}}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});applyPrefs();switchNote(active);$('docLabel').textContent=$('noteTitle').value||'Untitled';
})();
</script></body></html>
